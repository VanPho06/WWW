<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 5 create by Pho</title>
    <link type="text/css" rel="stylesheet" href="styles/login.css">
</head>
<body>
<div class="login">
    <h1> Register</h1>
    <form method="post" action="/Tuan1/login" id="register">
        <div>
            <input type="text" name="first-name"  placeholder="FirstName">
            <input type="text" name="last-name"  placeholder="LastName">
        </div>
        <input type="text" name="username" placeholder="Username"/>
        <input type="text" name="email" placeholder="E-mail"/>
        <input type="password" name="password" placeholder="Password">
        <input type="text" name="facebook" placeholder="Facebook"/>
        <input type="text" name="bio" placeholder="Short Bio"/>
        <button type="submit">Register</button>
    </form>
</div>
</body>
</html>
